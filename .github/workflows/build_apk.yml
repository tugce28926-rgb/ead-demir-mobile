name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project & SDK 34
        run: |
          flutter create --platforms=android --org=com.eaddemir --project-name=ead_mobile_app .
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          if (project.android.hasProperty('defaultConfig')) {
                              project.android.defaultConfig {
                                  minSdkVersion 23
                                  targetSdkVersion 34
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ead-demir-mobil-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            build/app/outputs/apk/release/*.apk
            build/app/outputs/flutter-apk/*.apk
