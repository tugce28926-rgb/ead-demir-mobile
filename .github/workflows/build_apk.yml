name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project & SDK 36
        run: |
          # Generate base flutter android wrapper without auto-running pub get
          flutter create --platforms=android --org=com.eaddemir --project-name=ead_mobile_app --no-pub .
          
          # Force EAD Demir App Label & Internet Permissions in Release Manifest
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.eaddemir.ead_mobile_app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <application
                  android:label="EAD Demir"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">EAD Demir</string></resources>' > android/app/src/main/res/values/strings.xml
          
          if [ -d "android_icons" ]; then
            cp -r android_icons/* android/app/src/main/res/ || true
          fi

          # Push bildirimi (Firebase Cloud Messaging) için google-services.json.
          # Firebase Console'dan indirilip repo köküne "google-services.json" adıyla
          # eklenmesi gerekiyor — yoksa bu adım sessizce atlanır (uygulama Firebase
          # olmadan da normal çalışmaya devam eder, sadece push bildirimi almaz).
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json bulundu, Firebase eklentisi ekleniyor."
            cat << 'EOF' >> android/build.gradle

          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }
          EOF
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          else
            echo "google-services.json bulunamadı, Firebase eklentisi atlanıyor."
          fi

          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          if (project.android.hasProperty('defaultConfig')) {
                              project.android.defaultConfig {
                                  minSdkVersion 23
                                  targetSdkVersion 36
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ead-demir-mobil-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            build/app/outputs/apk/release/*.apk
            build/app/outputs/flutter-apk/*.apk
