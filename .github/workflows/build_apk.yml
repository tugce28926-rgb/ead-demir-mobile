name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android SDK 34
        run: |
          flutter create --platforms=android --org=com.eaddemir --project-name=ead_mobile_app .
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ead-demir-mobil-apk
          path: build/app/outputs/flutter-apk/app-release.apk
